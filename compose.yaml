name: greenair-demo

services:
  backend:
    image: greenair-backend:demo
    build:
      context: ./services/backend
    ports:
      - "${GREENAIR_BIND_HOST:-127.0.0.1}:${GREENAIR_PORT:-8000}:8000"
    environment:
      GREENAIR_CORS_ORIGINS: '${GREENAIR_CORS_ORIGINS:-["http://localhost:${GREENAIR_WEB_PORT:-3000}","http://localhost:${GREENAIR_ADMIN_PORT:-3200}","http://localhost:5173"]}'
      GREENAIR_SERVING_DATA_MODE: "${GREENAIR_SERVING_DATA_MODE:-mock}"
      GREENAIR_DATABASE_URL: "${GREENAIR_DATABASE_URL:-}"
      GREENAIR_STATION_DATA_MODE: "${GREENAIR_STATION_DATA_MODE:-mock}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  web:
    image: greenair-web:local
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: "${GREENAIR_PUBLIC_API_URL:-http://localhost:8000}"
        NEXT_PUBLIC_ECOMAB_API_BASE_URL: ""
    ports:
      - "${GREENAIR_BIND_HOST:-127.0.0.1}:${GREENAIR_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  admin:
    image: greenair-admin:local
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_API_URL: "${GREENAIR_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "${GREENAIR_BIND_HOST:-127.0.0.1}:${GREENAIR_ADMIN_PORT:-3200}:3000"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
