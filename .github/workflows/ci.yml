name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  checks:
    name: Lint, tests, and commit messages
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.46.0"

      - name: Install locked dependencies
        run: just setup

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Select commits to check
        id: changes
        run: node scripts/ci-range.mjs >> "$GITHUB_OUTPUT"

      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
          HEAD_SHA: ${{ steps.changes.outputs.head }}
        run: node scripts/check-whitespace.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Check commit messages
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
          HEAD_SHA: ${{ steps.changes.outputs.head }}
        run: |
          args=(--to "$HEAD_SHA" --verbose)
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--from "$BASE_SHA")
          fi
          npm exec --no -- commitlint "${args[@]}"

  backend-container:
    name: Container and documented API smoke test
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Start backend image
        run: docker compose up --build --detach --wait --wait-timeout 120 backend
      - name: Exercise documented routes
        run: python3 scripts/smoke-backend.py
      - name: Container logs
        if: always()
        run: docker compose logs backend
      - name: Stop demo backend
        if: always()
        run: docker compose down
